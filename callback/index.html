<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Animystic Autopost · connecting</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6efe4;color:#2b2420;
       display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}
  code{background:#fff;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<main>
  <h2 id="msg">Connecting to Animystic Autopost…</h2>
  <p id="sub">You can close this tab once the terminal says "connected".</p>
</main>
<script>
// TikTok redirects here (https) after the account owner approves. This page only passes the one-time login code
// back to the Animystic Autopost tool running on the same computer (localhost). Nothing is stored or sent elsewhere.
(function () {
  var q = window.location.search;
  if (!q || q.indexOf('code=') < 0 && q.indexOf('error') < 0) {
    document.getElementById('msg').textContent = 'Animystic Autopost login page';
    document.getElementById('sub').textContent = 'Nothing to do here.';
    return;
  }
  window.location.replace('http://localhost:8723/callback/' + q);
})();
</script>
</body>
</html>
